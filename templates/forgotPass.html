<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
</head>
<body>
    <style>

    </style>
    <h1 id="page-head">Reset Password Form</h1>
    {% include 'loading.html' %}
    <div class="error-message"><span id="error-msg">{{ error }}</span><span id="close-error">X</span></div>
    <div class="password-reset-form-wrapper">
        <div id="student-password-reset-form">
            <form action="/password_verification/" method="POST">
                <div class="form-heading"><h1>Student</h1></div>
                {% csrf_token %}
                <input type="text" name="user" value="student" hidden required>
                <input type="text" name="userid" placeholder="ID" required>
                <input type="text" name="class" placeholder="Class" required>
                <input type="text" name="section" placeholder="Section" required>
                <input type="submit" value="Submit">
            </form>
        </div>
        <div id="teacher-password-reset-form">
            <form action="/password_verification/" method="POST">
                <div class="form-heading"><h1>Teacher</h1></div>
                {% csrf_token %}
                <input type="text" name="user" value="teacher" hidden required>
                <input type="text" name="userid" placeholder="ID" required>
                <input type="submit" value="Submit">
            </form>
        </div>
    </div>
</body>
</html>
