<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
</head>
<body>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=PT+Sans&display=swap');
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: 0.2s ease;
        }
        body{
            background: rgb(136, 212, 139);
        }
        body{
            overflow: hidden;
            font-family: 'PT Sans', sans-serif;
        }
        input,input:focus{
            outline: none;
        }
        .error-message{
            display: none;
            justify-content: space-between;
            margin-top: 50px; 
            position: fixed;
            min-width: 30%;
            font-family: 'PT Sans', sans-serif;
            padding: 12px 25px;
            text-align: center;
            background: #ff6363;  /*green: #63ff73 , red:  #ff6363 , black: #303030*/
            border-radius: 15px;
            left: 50%;
            transform: translate(-50%, 0%);
            color: #f2f2f2;
            font-weight: 600;
            z-index: 999;
        }
        #close-error{
            position: relative;
            background: #ff6363;
            padding: 0px 6.5px;
            color: #f2f2f2;
            font-weight: 600;
            cursor: pointer;
            font-family: 'PT Sans', sans-serif;
        }
        #close-error:hover{
            background: #bf3434;
        }
        #password-reset-form{
            background: #f2f2f2;
            border-radius: 15px;
            min-height: 400px;
            min-width: 30%;
            padding: 20px;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            max-width: 30%;
        }
        .key-icon{
            border: 5px solid #018100;
            border-radius: 50%;
            width: 130px;
            height: 130px;
            margin: 0px auto;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #key-img{
            transform: rotateZ(-45deg);
        }
        .password-input{
            display: block;
            padding: 8px;
            font-size: 1.1em;
            margin: 10px 0px;
            width: 100%;
        }
        #submit-btn{
            background: #018100;
            color: #f2f2f2;
            padding: 8px;
            width: 100%;
            cursor: pointer;
            font-size: 1.1em;
            border: none;
            outline: none;
            margin-top: 15px;
            border: 2px solid rgba(0,0,0,0);
        }
        #submit-btn:hover{
            background: #f2f2f2;
            color: #018100;
            border: 2px solid #018100;
        }
        .reset-pass-rules{
            width: 100%;
            color: #018100;
            font-size: large;
            font-weight: 400;
            margin: 20px 0px;
        }
    </style>
    {% include 'loading.html' %}
    <div class="error-message"><span id="error-msg">{{ error }}</span><span id="close-error">X</span></div>
    <form action="/reset_password/" method="POST" id="password-reset-form">
        <div class="key-icon"><img src="../static/images/key-ico.png" alt="key-icon" width="80px" height="80px" id="key-img"></div>
        {% csrf_token %}
        <div class="reset-pass-rules">
            <p>
                Reset your password for {{ userid }} connected with {{ usermail }} email account.
            </p>
        </div>
        <input type="password" placeholder="New Password" name="password" class="password-input" autocomplete="none">
        <input type="password" placeholder="Retype Password" name="re-password" class="password-input" autocomplete="none">
        <input type="submit" value="Reset Password" id="submit-btn">
    </form>
</body>
</html>
