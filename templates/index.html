{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="{% static 'css/home.css' %}">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="{% static 'js/app-main-home.js' %}"></script>
</head>
<body>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        a, a:active{
            color: inherit;
            text-decoration: none;
        }
        .navbar{
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgb(24, 95, 9);
            color: #f2f2f2;
            padding: 10px 20px;
        }
        .btn{
            padding: 6px;
            font-size: 1.1em;
            margin: 0px 5px;
        }
        .btn:hover{
            background: #f2f2f2;
            color: rgb(24, 95, 9);
        }
        .function-btns{
            display: flex;
            align-items: center;
        }
    </style>
    <div class="navbar" id="navbar">
        <div class="logo-wrap">
            <img src="{% static 'images/logo.png' %}" alt="" srcset="" width="50px">
        </div>
        <div class="function-btns">
            <div class="btn signup_btn" id="login">
                <a href="/signup/">Signup</a>
            </div>
            <div class="btn login_btn" id="login">
                <a href="/login/">Login</a>
            </div>
        </div>
    </div>
</body>
</html>
